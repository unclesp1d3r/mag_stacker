version: 2
updates:
  # This project uses Bun. Dependabot's "bun" ecosystem maintains bun.lock;
  # the "npm" ecosystem does not, which leaves the lockfile stale and breaks
  # `bun install --frozen-lockfile` in CI. Note: the bun ecosystem currently
  # supports version updates only (no security updates).
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # TS 6.0 changed `compilerOptions.types` to default to [] rather than
      # auto-discovering every @types/* package, so @types/bun no longer loads
      # and `bun:test` is unresolvable — `bun run typecheck` fails with ~40
      # TS2307s plus a TS2868 for the `Bun` global. TS 7 inherits both. The
      # nominal fix, types: ["bun"], is blocked upstream by oven-sh/bun#30503.
      # Full rationale: docs/adr/0010-defer-typescript-6-upgrade.md.
      #
      # Without this ignore Dependabot opens a fresh permanently-red PR on
      # every subsequent major release (see #43 for 6.x, #73 for 7.x); patch
      # and minor updates still come through. Note that it also removes the
      # recurring-PR nag, so the ADR is now the tracking mechanism — revisit
      # per its stated trigger: watch oven-sh/bun#30503.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"

  # Maintain dependencies for Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"

  # No "devcontainers" ecosystem: this repo has no .devcontainer.json or
  # .devcontainer/ directory — the toolchain is provisioned by mise.toml — so
  # Dependabot failed that update daily with `dependency_file_not_found`.
  # Re-add it alongside any future devcontainer config, not before.
