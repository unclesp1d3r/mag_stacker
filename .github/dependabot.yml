version: 2
updates:
  # This project uses Bun. Dependabot's "bun" ecosystem maintains bun.lock;
  # the "npm" ecosystem does not, which leaves the lockfile stale and breaks
  # `bun install --frozen-lockfile` in CI. Note: the bun ecosystem currently
  # supports version updates only (no security updates).
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # TypeScript 7 (the native port) can't resolve @types/bun, so `bun:test`
      # is unresolvable and `bun run typecheck` fails with ~40 TS2307s plus
      # TS2868 across the suite. The bump can't go green on a rebase, so
      # without this Dependabot opens a fresh permanently-red PR on every
      # subsequent TS 7.x release (see #73). Patch and minor updates still come
      # through. There is no upstream tracking issue to watch — revisit by
      # retrying the bump by hand once @types/bun claims TS 7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"

  # Maintain dependencies for Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"

  # Maintain dependencies for Dev Containers
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
