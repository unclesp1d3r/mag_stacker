name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest # ships a Docker daemon for Testcontainers
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # mise provisions the pinned dev tools (bun, etc.) from mise.toml.
      # install + cache keep CI in lockstep with local dev.
      - name: Set up mise tools
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `--frozen-lockfile` does not currently fail when bun.lock's embedded
      # manifest mirror has drifted from package.json (oven-sh/bun#24223,
      # still open) — a hand-edited package.json without a matching
      # `bun install` lands on main silently. Regenerating the lockfile and
      # diffing catches exactly that: bun preserves already-locked versions
      # that still satisfy their range, so a new upstream release does not
      # dirty the diff. `just lockfile-check` runs the same gate locally.
      # Drop this step once #24223 ships a fix.
      - name: Check lockfile is in sync with package.json
        run: |
          if ! bun install --lockfile-only; then
            echo "::error::bun install --lockfile-only failed; cannot verify that bun.lock matches package.json."
            exit 1
          fi
          if ! git diff --quiet bun.lock; then
            echo "::error file=bun.lock::bun.lock is out of sync with package.json. Run 'bun install' and commit the updated bun.lock."
            git diff bun.lock
            exit 1
          fi

      # Code gates: Biome (lint + format + import order), TypeScript, build.

      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          # Keep in sync with @biomejs/biome in package.json and the
          # biomejs/pre-commit rev in .pre-commit-config.yaml.
          version: 2.5.5
      - name: Run Biome
        run: biome ci

      - name: Type-check
        run: bun run typecheck

      # The unit/integration suite had no CI step at all, and its integration
      # tests additionally self-skipped whenever DATABASE_URL was unset — which
      # it always was here. Both halves of that gap are closed: the suite now
      # runs, and it provisions its own Postgres via Testcontainers, so there is
      # nothing to configure and nothing to skip.
      - name: Pre-pull Postgres image
        uses: ./.github/actions/pre-pull-postgres

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  e2e:
    runs-on: ubuntu-latest # ships a Docker daemon for Testcontainers
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Read-only job that runs repo code and uploads artifacts — keep the
          # GITHUB_TOKEN out of local git config.
          persist-credentials: false

      # Guard: resolved run credentials/tokens live under e2e/.artifacts/ and are
      # gitignored — fail loudly if any were ever force-added to the repo.
      - name: Guard against committed e2e artifacts
        run: |
          if git ls-files --error-unmatch 'e2e/.artifacts/*' 2>/dev/null; then
            echo "::error::e2e/.artifacts/ must never be committed (it holds generated secrets)."
            exit 1
          fi

      - name: Set up mise tools
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No lockfile-drift check here on purpose: this install is subject to
      # the same oven-sh/bun#24223 gap as the `ci` job's, but `ci` failing
      # already blocks the merge, so duplicating the gate would only cost
      # runtime. If that check ever moves out of `ci`, add it back here.
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Pre-pull Postgres image
        uses: ./.github/actions/pre-pull-postgres

      # Build ahead of the suite so the launcher finds .next and skips the cold
      # build inside the webServer startup timeout.
      - name: Build
        run: bun run build

      - name: Run E2E suite
        run: bun run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
